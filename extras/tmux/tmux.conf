# ~/.tmux.conf
#
# Optional. tmux is only needed if you want the "IDE layout": Neovim on the
# left, the OpenCode AI chat on the right, both alive after you close the
# window. The `ide` script (installed to ~/.local/bin) sets that up for you.
#
# Everything here is chosen so that a VS Code user is never surprised:
#   - mouse works (click panes, drag borders, scroll)
#   - the prefix is still Ctrl+B (no relearning)
#   - splits open in the current directory
#   - true colour and the system clipboard work

# ---------------------------------------------------------------------------
# Basics
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Let Neovim talk to the outer terminal (needed by image previews and by
# OpenCode's TUI if you ever run it inside a pane).
set -g allow-passthrough on

# Pass ESC quickly: Neovim's Esc-Esc terminal escape must not lag.
set -sg escape-time 10

# Reload this file with prefix + r.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Panes and windows (the few that matter)
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split in the current directory, keeping the path you are working in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with the arrow keys (mouse dragging works too).
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# ---------------------------------------------------------------------------
# Mouse: click to focus, drag borders to resize, scroll to scroll
# ---------------------------------------------------------------------------
set -g mouse on

# ---------------------------------------------------------------------------
# Copy/paste with the macOS clipboard
# ---------------------------------------------------------------------------
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Status bar: quiet, readable, same colours as the editor
# ---------------------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]│ "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# New panes/windows inherit the current working directory.
set -g pane-border-status off
set -g focus-events on

# ---------------------------------------------------------------------------
# Quality of life
# ---------------------------------------------------------------------------
set -g history-limit 20000
set -g display-time 1500
setw -g mode-keys vi

# Prefix + q closes the pane (asks first when a process is running).
bind q kill-pane
