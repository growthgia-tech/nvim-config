# .stylua.toml
#
# Formatting rules for this config's Lua. `make format` runs stylua with these.
# They match the style the config is already written in, so running the
# formatter should produce no surprises.

column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
